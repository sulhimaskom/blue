name: oc analyzer

# Continuous Cycle: Analyzer → PR → Standarizer → PR → Analyzer
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["smart-ci"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read # Needed for turnstyle

concurrency:
  group: oc-agent
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze Codebase
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      IFLOW_API_KEY: ${{ secrets.IFLOW_API_KEY }}

    steps:
      - name: Wait in Queue
        uses: softprops/turnstyle@v2
        with:
          poll-interval-seconds: 30
          same-branch-only: false
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.opencode
            ~/.npm
            **/node_modules
          key: ${{ runner.os }}-opencode-v2-${{ hashFiles('**/package*.json') }}
          restore-keys: |
            ${{ runner.os }}-opencode-v2-
            ${{ runner.os }}-opencode-v1-

      - name: Configure Git
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      - name: Install OpenCode
        run: |
          # Use specific version to avoid GitHub API rate limiting issues
          curl -fsSL https://opencode.ai/install | bash -s -- --version 1.0.193
          echo "$HOME/.opencode/bin" >> $GITHUB_PATH

      - name: Verify OpenCode Installation
        run: |
          opencode --version || (echo "OpenCode installation failed" && exit 1)

      - name: Verify OpenCode Version
        run: |
          opencode_version=$(opencode --version)
          echo "OpenCode version: $opencode_version"

          # Clean up any existing installation to ensure version consistency
          echo "🧹 Cleaning up existing OpenCode installation..."
          rm -rf ~/.opencode

          # Reinstall with exact version
          echo "🔄 Reinstalling OpenCode version 1.0.193..."
          curl -fsSL https://opencode.ai/install | bash -s -- --version 1.0.193
          echo "$HOME/.opencode/bin" >> $GITHUB_PATH

          # Verify version after reinstall
          final_version=$(opencode --version)
          echo "Final OpenCode version: $final_version"

          if [ "$final_version" != "1.0.193" ]; then
            echo "❌ Critical: Version mismatch after reinstall. Expected 1.0.193, got $final_version"
            exit 1
          fi

          echo "✅ OpenCode version 1.0.193 verified successfully"

      - name: Execute
        run: |
          export GITHUB_RUN_ID=${{ github.run_id }}

          # Increase timeout and add better error handling
          echo "🚀 Starting OpenCode analyzer with 10-minute timeout..."
          timeout 600 opencode run "$(cat .github/prompts/analyzer-system.md)" \
            --model iflowcn/glm-4.6 \
            --share false \
            --timeout 600

          # Capture exit code for better error handling
          exit_code=$?
          echo "Analyzer completed with exit code: $exit_code"

          # Handle different exit scenarios
          if [ $exit_code -eq 124 ]; then
            echo "⚠️ Analyzer timed out after 10 minutes"
            exit 1
          elif [ $exit_code -eq 0 ]; then
            echo "✅ Analyzer completed successfully"
          else
            echo "⚠️ Analyzer failed with exit code $exit_code"
            exit $exit_code
          fi

      - name: Fallback on Failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "⚠️ Analyzer workflow failed. Creating issue for manual review."
          gh issue create \
            --title "🤖 Analyzer Failed - $(date +%Y-%m-%d)" \
            --body "## Analyzer Failure Report

          **Workflow**: oc analyzer
          **Run ID**: ${{ github.run_id }}
          **Time**: $(date)

          ### Action Required
          Please review the workflow logs and manually address any issues.

          ---
          *This issue was auto-generated.*" \
            --label "bug" || echo "Could not create issue"
