name: CI/CD Monitoring & Observability

on:
  workflow_run:
    workflows: ["CI Check", "on-push", "on pull"]
    types: [completed, in_progress]
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: monitoring-${{ github.ref }}
  cancel-in-progress: false

jobs:
  monitor-ci-health:
    name: Monitor CI Health
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    if: github.event.workflow_run.event == 'workflow_run'
    
    outputs:
      workflow_status: ${{ steps.monitor.outputs.status }}
      build_duration: ${{ steps.monitor.outputs.duration }}
      test_duration: ${{ steps.monitor.outputs.test_duration }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Monitor Workflow Run
        id: monitor
        uses: actions/github-script@v7
        with:
          script: |
            const runId = ${{ github.event.workflow_run.id }};
            const workflowName = ${{ github.event.workflow_run.name }};
            const status = ${{ github.event.workflow_run.conclusion || 'in_progress' }};
            const startedAt = new Date(${{ github.event.workflow_run.run_started_at }});
            const updatedAt = new Date(${{ github.event.workflow_run.updated_at }});
            const duration = Math.round((updatedAt - startedAt) / 1000);

            console.log(`Workflow: ${workflowName}`);
            console.log(`Status: ${status}`);
            console.log(`Duration: ${duration}s`);

            core.setOutput('status', status);
            core.setOutput('duration', duration.toString());

            // Extract test duration from logs if available
            if (status === 'success' || status === 'failure') {
              try {
                const jobs = await github.rest.actions.listJobsForWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: runId
                });

                let totalTestDuration = 0;
                for (const job of jobs.data.jobs) {
                  if (job.name.includes('test') || job.name.includes('CI')) {
                    const jobStarted = new Date(job.started_at);
                    const jobCompleted = new Date(job.completed_at);
                    totalTestDuration += Math.round((jobCompleted - jobStarted) / 1000);
                  }
                }

                core.setOutput('test_duration', totalTestDuration.toString());
                console.log(`Test duration: ${totalTestDuration}s`);
              } catch (error) {
                console.log(`Could not extract test duration: ${error.message}`);
                core.setOutput('test_duration', '0');
              }
            }

            // Alert on failures
            if (status === 'failure') {
              core.setFailed(`Workflow ${workflowName} failed in ${duration}s`);
            }

  collect-metrics:
    name: Collect CI/CD Metrics
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Collect Build Metrics
        id: metrics
        run: |
          # Record start time
          START_TIME=$(date +%s)

          # Install dependencies
          echo "📦 Installing dependencies..."
          npm ci --silent --no-audit --no-fund
          DEPS_TIME=$(date +%s)

          # Typecheck
          echo "🔍 Running typecheck..."
          if time npm run typecheck; then
            TYPECHECK_STATUS="✅ PASS"
            TYPECHECK_TIME=$(date +%s)
          else
            TYPECHECK_STATUS="❌ FAIL"
            TYPECHECK_TIME=$(date +%s)
          fi

          # Lint
          echo "🔧 Running lint..."
          if time npm run lint; then
            LINT_STATUS="✅ PASS"
            LINT_TIME=$(date +%s)
          else
            LINT_STATUS="❌ FAIL"
            LINT_TIME=$(date +%s)
          fi

          # Build
          echo "🏗️  Running build..."
          if time npm run build; then
            BUILD_STATUS="✅ PASS"
            BUILD_TIME=$(date +%s)
          else
            BUILD_STATUS="❌ FAIL"
            BUILD_TIME=$(date +%s)
          fi

          # Test
          echo "🧪 Running tests..."
          if time npm test --silent; then
            TEST_STATUS="✅ PASS"
            TEST_TIME=$(date +%s)
          else
            TEST_STATUS="❌ FAIL"
            TEST_TIME=$(date +%s)
          fi

          # Calculate durations
          TOTAL_TIME=$(date +%s)
          DEPS_DURATION=$((DEPS_TIME - START_TIME))
          TYPECHECK_DURATION=$((TYPECHECK_TIME - DEPS_TIME))
          LINT_DURATION=$((LINT_TIME - TYPECHECK_TIME))
          BUILD_DURATION=$((BUILD_TIME - LINT_TIME))
          TEST_DURATION=$((TEST_TIME - BUILD_TIME))
          OVERALL_DURATION=$((TOTAL_TIME - START_TIME))

          # Output metrics
          echo "dependencies_duration=${DEPS_DURATION}s" >> $GITHUB_OUTPUT
          echo "typecheck_duration=${TYPECHECK_DURATION}s" >> $GITHUB_OUTPUT
          echo "lint_duration=${LINT_DURATION}s" >> $GITHUB_OUTPUT
          echo "build_duration=${BUILD_DURATION}s" >> $GITHUB_OUTPUT
          echo "test_duration=${TEST_DURATION}s" >> $GITHUB_OUTPUT
          echo "overall_duration=${OVERALL_DURATION}s" >> $GITHUB_OUTPUT
          echo "typecheck_status=${TYPECHECK_STATUS}" >> $GITHUB_OUTPUT
          echo "lint_status=${LINT_STATUS}" >> $GITHUB_OUTPUT
          echo "build_status=${BUILD_STATUS}" >> $GITHUB_OUTPUT
          echo "test_status=${TEST_STATUS}" >> $GITHUB_OUTPUT

          # Create metrics summary
          cat > metrics-summary.md << 'EOF'
          # CI/CD Metrics Summary
          
          | Stage | Status | Duration |
          |-------|--------|----------|
          | Dependencies | ✅ | ${DEPS_DURATION}s |
          | Typecheck | ${TYPECHECK_STATUS} | ${TYPECHECK_DURATION}s |
          | Lint | ${LINT_STATUS} | ${LINT_DURATION}s |
          | Build | ${BUILD_STATUS} | ${BUILD_DURATION}s |
          | Test | ${TEST_STATUS} | ${TEST_DURATION}s |
          | **Overall** | **-** | **${OVERALL_DURATION}s** |
          EOF

          cat metrics-summary.md

      - name: Upload Metrics Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-metrics-${{ github.run_id }}
          path: metrics-summary.md
          retention-days: 30

      - name: Generate Performance Report
        run: |
          # Generate performance report
          cat > performance-report.json << EOF
          {
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "workflow_run_id": "${{ github.run_id }}",
            "workflow_name": "${{ github.workflow }}",
            "metrics": {
              "dependencies": {
                "duration": "${{ steps.metrics.outputs.dependencies_duration }}"
              },
              "typecheck": {
                "duration": "${{ steps.metrics.outputs.typecheck_duration }}",
                "status": "${{ steps.metrics.outputs.typecheck_status }}"
              },
              "lint": {
                "duration": "${{ steps.metrics.outputs.lint_duration }}",
                "status": "${{ steps.metrics.outputs.lint_status }}"
              },
              "build": {
                "duration": "${{ steps.metrics.outputs.build_duration }}",
                "status": "${{ steps.metrics.outputs.build_status }}"
              },
              "test": {
                "duration": "${{ steps.metrics.outputs.test_duration }}",
                "status": "${{ steps.metrics.outputs.test_status }}"
              },
              "overall": {
                "duration": "${{ steps.metrics.outputs.overall_duration }}"
              }
            },
            "branch": "${{ github.ref_name }}",
            "commit": "${{ github.sha }}"
          }
          EOF

          cat performance-report.json

      - name: Upload Performance Report
        uses: actions/upload-artifact@v4
        with:
          name: performance-report-${{ github.run_id }}
          path: performance-report.json
          retention-days: 30

      - name: Check Performance Thresholds
        id: thresholds
        run: |
          OVERALL=${{ steps.metrics.outputs.overall_duration }}
          BUILD=${{ steps.metrics.outputs.build_duration }}
          TEST=${{ steps.metrics.outputs.test_duration }}

          # Thresholds (adjust based on baseline)
          OVERALL_THRESHOLD=120  # 2 minutes
          BUILD_THRESHOLD=60     # 1 minute
          TEST_THRESHOLD=30       # 30 seconds

          EXCEEDED=0
          WARNINGS=()

          if [ "$OVERALL" -gt "$OVERALL_THRESHOLD" ]; then
            WARNINGS+=("Overall duration ${OVERALL}s exceeds threshold ${OVERALL_THRESHOLD}s")
            EXCEEDED=$((EXCEEDED + 1))
          fi

          if [ "$BUILD" -gt "$BUILD_THRESHOLD" ]; then
            WARNINGS+=("Build duration ${BUILD}s exceeds threshold ${BUILD_THRESHOLD}s")
            EXCEEDED=$((EXCEEDED + 1))
          fi

          if [ "$TEST" -gt "$TEST_THRESHOLD" ]; then
            WARNINGS+=("Test duration ${TEST}s exceeds threshold ${TEST_THRESHOLD}s")
            EXCEEDED=$((EXCEEDED + 1))
          fi

          echo "thresholds_exceeded=$EXCEEDED" >> $GITHUB_OUTPUT

          if [ $EXCEEDED -gt 0 ]; then
            echo "⚠️ Performance Warnings:"
            for warning in "${WARNINGS[@]}"; do
              echo "  - $warning"
            done
          else
            echo "✅ All performance thresholds met"
          fi

      - name: Create Performance Issue
        if: steps.thresholds.outputs.thresholds_exceeded != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🚨 Performance Degradation - ${new Date().toISOString().split('T')[0]}`;
            const body = `## CI/CD Performance Alert
            
            **Workflow Run**: #${{ github.run_id }}
            **Branch**: ${{ github.ref_name }}
            **Commit**: ${{ github.sha }}
            **Timestamp**: $(date -u +%Y-%m-%dT%H:%M:%SZ)
            
            ### Metrics
            - **Dependencies**: ${{ steps.metrics.outputs.dependencies_duration }}s
            - **Typecheck**: ${{ steps.metrics.outputs.typecheck_duration }}s (${{ steps.metrics.outputs.typecheck_status }})
            - **Lint**: ${{ steps.metrics.outputs.lint_duration }}s (${{ steps.metrics.outputs.lint_status }})
            - **Build**: ${{ steps.metrics.outputs.build_duration }}s (${{ steps.metrics.outputs.build_status }})
            - **Test**: ${{ steps.metrics.outputs.test_duration }}s (${{ steps.metrics.outputs.test_status }})
            - **Overall**: ${{ steps.metrics.outputs.overall_duration }}s
            
            ### Performance Thresholds Exceeded: ${{ steps.thresholds.outputs.thresholds_exceeded }}
            
            Please review the build logs and consider optimization opportunities.
            
            ---
            *Automated monitoring alert*`;
            
            // Check if similar issue already exists
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci,performance,P2',
              sort: 'created',
              direction: 'desc',
              per_page: 1
            });
            
            if (issues.length === 0 || !issues[0].title.includes('Performance Degradation')) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['ci', 'performance', 'P2']
              });
            }

  generate-daily-report:
    name: Generate Daily Health Report
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    if: github.event_name == 'schedule'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Workflow Runs
        id: runs
        uses: actions/github-script@v7
        with:
          script: |
            const { data: runs } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 20
            });

            let ciRuns = 0;
            let failedRuns = 0;
            let avgDuration = 0;

            for (const run of runs.workflow_runs) {
              if (run.name === 'CI Check') {
                ciRuns++;
                if (run.conclusion === 'failure') {
                  failedRuns++;
                }
                if (run.run_started_at && run.updated_at) {
                  const duration = Math.round((new Date(run.updated_at) - new Date(run.run_started_at)) / 1000);
                  avgDuration += duration;
                }
              }
            }

            if (ciRuns > 0) {
              avgDuration = Math.round(avgDuration / ciRuns);
            }

            console.log(`CI Runs: ${ciRuns}`);
            console.log(`Failed: ${failedRuns}`);
            console.log(`Avg Duration: ${avgDuration}s`);

            core.setOutput('ci_runs', ciRuns.toString());
            core.setOutput('failed_runs', failedRuns.toString());
            core.setOutput('avg_duration', avgDuration.toString());

      - name: Generate Report
        run: |
          cat > daily-health-report.md << EOF
          # CI/CD Daily Health Report
          
          **Date**: $(date -u +%Y-%m-%d)
          **Branch**: ${{ github.ref_name }}
          
          ## Summary
          - **Total CI Runs**: ${{ steps.runs.outputs.ci_runs }}
          - **Failed Runs**: ${{ steps.runs.outputs.failed_runs }}
          - **Success Rate**: $((( ${{ steps.runs.outputs.ci_runs }} - ${{ steps.runs.outputs.failed_runs }} ) * 100 / ${{ steps.runs.outputs.ci_runs }} ))%
          - **Average Duration**: ${{ steps.runs.outputs.avg_duration }}s
          
          ## Status
          EOF

          if [ "${{ steps.runs.outputs.failed_runs }}" == "0" ]; then
            echo "✅ All CI runs passed successfully" >> daily-health-report.md
          else
            echo "⚠️ Some CI runs failed - review needed" >> daily-health-report.md
          fi

          cat daily-health-report.md

      - name: Upload Daily Report
        uses: actions/upload-artifact@v4
        with:
          name: daily-health-report-$(date +%Y%m%d)
          path: daily-health-report.md
          retention-days: 7

  respond-to-monitor-command:
    name: Respond to Monitor Command
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    if: github.event_name == 'issue_comment' && contains(github.event.comment.body, '/monitor')
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Quick Health Check
        run: |
          # Quick health check
          cat > quick-health.md << EOF
          # Quick CI/CD Health Check
          
          **Requested by**: @${{ github.actor }}
          **Repository**: ${{ github.repository }}
          **Branch**: ${{ github.ref_name }}
          **Timestamp**: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          
          ## Current Status
          
          ### Branches
          EOF

          git branch -a >> quick-health.md

          cat >> quick-health.md << EOF
          
          ### Recent Commits
          EOF

          git log --oneline -5 >> quick-health.md

          cat quick-health.md

      - name: Comment on Issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('quick-health.md', 'utf8');
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: report
            });
