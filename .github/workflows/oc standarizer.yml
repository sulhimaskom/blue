name: oc standarizer

# Continuous Cycle: Analyzer → PR → Standarizer → PR → Analyzer
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["oc analyzer"]
    types: [completed]
    branches: [dev]

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: oc-agent
  cancel-in-progress: false

jobs:
  standardize:
    name: Pick and Execute Task
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      IFLOW_API_KEY: ${{ secrets.IFLOW_API_KEY }}

    steps:
      - name: Wait in Queue
        uses: softprops/turnstyle@v2
        with:
          poll-interval-seconds: 30
          same-branch-only: false
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.opencode
          key: ${{ runner.os }}-opencode-v1
          restore-keys: |
            ${{ runner.os }}-opencode-

      - name: Configure Git
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      - name: Install OpenCode
        run: |
          # Use specific version to avoid GitHub API rate limiting issues
          if [ ! -f "$HOME/.opencode/bin/opencode" ]; then
            curl -fsSL https://opencode.ai/install | bash -s -- --version 1.0.193
          fi
          echo "$HOME/.opencode/bin" >> $GITHUB_PATH

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: |
          npm install

      - name: Verify OpenCode Installation
        run: |
          opencode --version || (echo "OpenCode installation failed" && exit 1)

      - name: Execute
        run: |
          PROMPT_CONTENT=$(cat .github/prompts/standarizer-main.md)
          PROMPT_CONTENT="${PROMPT_CONTENT//\{\{MACHINE_CONTEXT\}\}/${{ env.MACHINE_CONTEXT }}}"

          opencode run "$PROMPT_CONTENT" \
            --model iflowcn/glm-4.6 \
            --share false \

      - name: Run OpenCode - Bug Fix
        id: run_oc1
        timeout-minutes: 60
        run: |
          PROMPT_CONTENT=$(cat .github/prompts/standarizer-bugfix.md)
          PROMPT_CONTENT="${PROMPT_CONTENT//\{\{MACHINE_CONTEXT\}\}/${{ env.MACHINE_CONTEXT }}}"

          opencode run "$PROMPT_CONTENT" \
            --model iflowcn/glm-4.6 \
            --share false \

      - name: Run OpenCode - Improvement
        id: run_oc2
        timeout-minutes: 60
        run: |
          PROMPT_CONTENT=$(cat .github/prompts/standarizer-improvement.md)
          PROMPT_CONTENT="${PROMPT_CONTENT//\{\{MACHINE_CONTEXT\}\}/${{ env.MACHINE_CONTEXT }}}"

          opencode run "$PROMPT_CONTENT" \
            --model iflowcn/glm-4.6 \
            --share false \

      - name: Run OpenCode - Modularization
        id: run_oc3
        timeout-minutes: 60
        run: |
          PROMPT_CONTENT=$(cat .github/prompts/standarizer-modularization.md)
          PROMPT_CONTENT="${PROMPT_CONTENT//\{\{MACHINE_CONTEXT\}\}/${{ env.MACHINE_CONTEXT }}}"

          opencode run "$PROMPT_CONTENT" \
            --model iflowcn/glm-4.6 \
            --share false \

      - name: Fallback on Failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "⚠️ Agent workflow failed. Creating issue for manual review."
          gh issue create \
            --title "🤖 Agent Workflow Failed - $(date +%Y-%m-%d)" \
            --body "## Agent Failure Report

          **Workflow**: oc standarizer
          **Run ID**: ${{ github.run_id }}
          **Time**: $(date)

          ### Action Required
          Please review the workflow logs and manually address any issues.

          ---
          *This issue was auto-generated.*" \
            --label "bug" || echo "Could not create issue"
