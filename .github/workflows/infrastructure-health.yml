name: Infrastructure Health Monitor

on:
  push:
    branches: [agent-workspace, dev]
  pull_request:
    branches: [agent-workspace, dev]
  schedule:
    # Run every 4 hours to catch infrastructure degradation
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: true
        default: "check"
        type: choice
        options:
          - check
          - recover
          - report

jobs:
  infrastructure-health:
    name: Infrastructure Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Check infrastructure health
        id: health-check
        run: |
          echo "Checking infrastructure health..."
          ./scripts/infrastructure-health-monitor.sh check
        continue-on-error: true

      - name: Attempt auto-recovery if needed
        if: steps.health-check.outcome == 'failure'
        run: |
          echo "Infrastructure issues detected, attempting recovery..."
          ./scripts/infrastructure-health-monitor.sh

      - name: Run quality gates
        run: |
          echo "Running quality gate validation..."
          ./scripts/infrastructure-health-monitor.sh test

      - name: Generate health report
        run: |
          echo "Generating health report..."
          ./scripts/infrastructure-health-monitor.sh report

      - name: Upload health reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infrastructure-reports
          path: infrastructure-health-*.json
          retention-days: 30

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Infrastructure health check failed. See reports for details."
          echo "::error::This may block development and deployment operations."

  manual-actions:
    name: Manual Infrastructure Actions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Execute manual action
        run: |
          echo "Executing manual action: ${{ github.event.inputs.action }}"
          ./scripts/infrastructure-health-monitor.sh ${{ github.event.inputs.action }}

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infrastructure-manual-reports
          path: infrastructure-health-*.json
          retention-days: 7
