name: CI Check

on:
  workflow_run:
    workflows: ["oc standarizer"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [agent-workspace, dev]
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
    branches: [dev]
    paths-ignore:
      - "docs/**"
      - "*.md"

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: CI Check
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ steps.detect-pm.outputs.pm }}

      - name: Detect Package Manager
        id: detect-pm
        run: |
          if [ -f "pnpm-lock.yaml" ]; then
            echo "pm=pnpm" >> $GITHUB_OUTPUT
            echo "install=pnpm install --frozen-lockfile" >> $GITHUB_OUTPUT
          elif [ -f "yarn.lock" ]; then
            echo "pm=yarn" >> $GITHUB_OUTPUT
            echo "install=yarn install --frozen-lockfile" >> $GITHUB_OUTPUT
          elif [ -f "bun.lockb" ]; then
            echo "pm=bun" >> $GITHUB_OUTPUT
            echo "install=bun install --frozen-lockfile" >> $GITHUB_OUTPUT
          else
            echo "pm=npm" >> $GITHUB_OUTPUT
            echo "install=npm ci" >> $GITHUB_OUTPUT
          fi

      - name: Setup
        if: steps.detect-pm.outputs.pm == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            ~/.npm
            ~/.cache
            **/node_modules
            **/.next/cache
          key: ${{ runner.os }}-${{ steps.detect-pm.outputs.pm }}-v3-${{ hashFiles('**/pnpm-lock.yaml', '**/package-lock.json', '**/yarn.lock', '**/next.config.*') }}
          restore-keys: |
            ${{ runner.os }}-${{ steps.detect-pm.outputs.pm }}-v3-
            ${{ runner.os }}-${{ steps.detect-pm.outputs.pm }}-v2-

      - name: Install Dependencies
        run: ${{ steps.detect-pm.outputs.install }}

      - name: Typecheck
        id: typecheck
        continue-on-error: false
        run: |
          if grep -q '"typecheck"' package.json; then
            ${{ steps.detect-pm.outputs.pm }} run typecheck
          fi

      - name: Lint
        id: lint
        continue-on-error: false
        run: |
          if grep -q '"lint"' package.json; then
            ${{ steps.detect-pm.outputs.pm }} run lint
          fi

      - name: Test
        id: test
        continue-on-error: false
        run: |
          if grep -q '"test"' package.json; then
            ${{ steps.detect-pm.outputs.pm }} test
          fi

      - name: Build
        id: build
        continue-on-error: false
        run: |
          if grep -q '"build"' package.json; then
            ${{ steps.detect-pm.outputs.pm }} run build
          fi

      - name: Check Results
        continue-on-error: false
        run: |
          FAILED_CHECKS=0
          if [[ "${{ steps.typecheck.outcome }}" == "failure" ]]; then
            echo "❌ Typecheck failed: ${{ steps.typecheck.outcome }}"
            FAILED_CHECKS=$((FAILED_CHECKS + 1))
          fi
          if [[ "${{ steps.lint.outcome }}" == "failure" ]]; then
            echo "❌ Lint failed: ${{ steps.lint.outcome }}"
            FAILED_CHECKS=$((FAILED_CHECKS + 1))
          fi
          if [[ "${{ steps.test.outcome }}" == "failure" ]]; then
            echo "❌ Test failed: ${{ steps.test.outcome }}"
            FAILED_CHECKS=$((FAILED_CHECKS + 1))
          fi
          if [[ "${{ steps.build.outcome }}" == "failure" ]]; then
            echo "❌ Build failed: ${{ steps.build.outcome }}"
            FAILED_CHECKS=$((FAILED_CHECKS + 1))
          fi

          if [[ $FAILED_CHECKS -gt 0 ]]; then
            echo "❌ CI Check failed ($FAILED_CHECKS failures)"
            echo "  Typecheck: ${{ steps.typecheck.outcome }}"
            echo "  Lint: ${{ steps.lint.outcome }}"
            echo "  Test: ${{ steps.test.outcome }}"
            echo "  Build: ${{ steps.build.outcome }}"
            echo "CHECKS_FAILED=true" >> $GITHUB_ENV
          else
            echo "✅ All checks passed"
          fi

      - name: Trigger oc smart-ci
        continue-on-error: true
        if: env.CHECKS_FAILED == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "🚀 Triggering oc smart-ci to auto-fix..."
          gh workflow run "oc smart-ci.yml" --ref ${{ github.head_ref || github.ref_name }}

      - name: Fail if checks failed
        if: env.CHECKS_FAILED == 'true'
        run: exit 1
